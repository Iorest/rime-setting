patch:
  # --- 1. 引用通用设置 ---
  switches:
    __include: shared_common:/common_switches
  engine/filters:
    __include: shared_common:/common_engine_filters
  engine/translators:
    __include: shared_common:/common_engine_translators

  # --- 2. 引用共用功能配置 ---
  english:
    __include: shared_common:/english_config
  custom_phrase:
    __include: shared_common:/custom_phrase_config
  emoji_suggestion:
    __include: shared_common:/emoji_config
  reverse_lookup:
    __include: shared_common:/reverse_lookup_config
  recognizer/patterns:
    __include: shared_common:/common_patterns

  # --- 3. 方案特有配置 ---
  translator/dictionary: luna_pinyin.extended
  translator/enable_correction: true
  translator/preedit_format: []

  # 拼写运算规则
  speller/algebra:
    - erase/^xx$/
    - derive/^([zcs])h/$1/
    - derive/^([zcs])([^h])/$1h$2/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/

  # 依赖项
  schema/dependencies:
    - stroke
    - easy_en
  "engine/segmentors/@before 0": affix_segmentor@reverse_lookup

  # 语言模型
  __include: grammar:/hans
